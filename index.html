<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calc">
        <h1 class="text" id="txt">
            Kalkulator
        </h1>
        <input type="text" id="result" class="rst">
        <br>
        <br>
        <div class="button-group">
            <button class="btn" onclick="counttoDisplay(1)">1</button>
            <button class="btn" onclick="counttoDisplay(2)">2</button>
            <button class="btn" onclick="counttoDisplay(3)">3</button>
            <button class="btn" onclick="counttoDisplay(4)">4</button>
            <button class="btn" onclick="counttoDisplay(5)">5</button>
            <button class="btn" onclick="counttoDisplay(6)">6</button>
            <button class="btn" onclick="counttoDisplay(7)">7</button>
            <button class="btn" onclick="counttoDisplay(8)">8</button>
            <button class="btn" onclick="counttoDisplay(9)">9</button>
            <button class="btn" onclick="counttoDisplay(0)">0</button>
            <button class="btn" onclick="clearDisplay()">C</button>
            <button class="btn" onclick="deleteLast()">DEL</button>
            <button class="btn" onclick="counttoDisplay('+')">+</button>
            <button class="btn" onclick="counttoDisplay('-')">-</button>
            <button class="btn" onclick="counttoDisplay('*')">*</button>
            <button class="btn" onclick="counttoDisplay('/')">/</button>
            <button class="btn" onclick="calculateResult()">=</button>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
